name: Update PKGBUILD

on:
  repository_dispatch:
    types: [update-pkgbuild]

permissions:
  contents: write

env:
  VERSION: ${{ github.event.client_payload.version }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update PKGBUILD
        env:
          SHA256: ${{ github.event.client_payload.sha256_source }}
        run: |
          pkgver="${VERSION#v}"
          sed -i "s/^pkgver=.*/pkgver=${pkgver}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA256}')/" PKGBUILD

      - name: Generate .SRCINFO
        uses: hapakaien/archlinux-package-action@v2
        with:
          flags: ""
          namcap: false
          srcinfo: true

      - name: Commit and push to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "Update to ${VERSION}"
            git push
          }

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
            StrictHostKeyChecking accept-new
          EOF
          ssh -T aur@aur.archlinux.org -v 2>&1 | head -50 || true
          git remote add aur ssh://aur@aur.archlinux.org/lazystack.git
          git fetch aur master
          git checkout aur/master
          git checkout main -- PKGBUILD .SRCINFO
          git commit -m "Update to ${VERSION}" --allow-empty
          git push aur HEAD:master
